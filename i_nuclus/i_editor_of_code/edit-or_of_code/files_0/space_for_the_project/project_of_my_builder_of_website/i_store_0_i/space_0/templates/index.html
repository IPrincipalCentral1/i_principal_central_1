














<!DOCTYPE html>
<html>
<head>
    <title>تشغيل ملف بايثون</title>
</head>
<body>

    <h2>رفع ملف Python وتشغيله</h2>


    <form action="/upload" method="post" enctype="multipart/form-data">

        <input type="file" name="python_file" accept=".py" required>

        <button type="submit">تشغيل</button>

    </form>

    <br>

    <form action="/stop" method="post">

        <button type="submit">إيقاف البرنامج</button>

    </form>

</body>
</html>
