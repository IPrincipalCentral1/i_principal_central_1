    <div class="clock">
        <h1>🕒 i_horloge_0_i</h1>

        <button onclick="toggleFormat()">
            تغيير نظام الوقت
        </button>
        
        
        
        
    </div>
    
    
    <div class="i_section_0_i">
        
        <div class="i_squer_0_i">
            
            
            <div id="counter">0.00  </div>
            
            <div id="unity_0"> DZD دينار</div>
                
            
            
        </div>
        
        
        <div class="i_squer_1_i">

    <script>
        let use24Hour = true;

        function updateClock() {
            const now = new Date();

            document.getElementById("time").textContent =
                now.toLocaleTimeString("fr-DZ", {
                    timeZone: "Africa/Algiers",
                    hour12: !use24Hour,
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                });

            document.getElementById("date").textContent =
                now.toLocaleDateString("ar-DZ", {
                    timeZone: "Africa/Algiers",
                    weekday: "long",
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                });
        }

        function toggleFormat() {
            use24Hour = !use24Hour;
            updateClock();
        }

        updateClock();
        setInterval(updateClock, 1000);
        
        
        let i_time_of_wait_0_i = 100;
        
        let i_counter_0_i = 0;
        
        let i_limit_0_i = 100000;
        
        let i_incrimenter_0_i = 0.012;
        
        let i_precision_1_i = 100;
        
        let i_tofixed_1_i = 2;
        
        
        function i_update_counter_0_i() {
            document.getElementById("counter").textContent =
                i_counter_0_i.toFixed(i_tofixed_1_i);
        
            i_counter_0_i = Math.round(
                (i_counter_0_i + i_incrimenter_0_i) * i_precision_1_i
            ) / i_precision_1_i;
        
            if (i_counter_0_i > i_limit_0_i) {
                i_counter_0_i = 0;
            }
        }
        
        
        
        
        i_update_counter_0_i();
        
        setInterval(i_update_counter_0_i, i_time_of_wait_0_i);
        
        
        
        
        let i_counter_1_i = 0;
        
        
        function i_update_counter_1_i() {
            document.getElementById("counter_1").textContent =
                i_counter_1_i.toFixed(i_tofixed_1_i);
        
            i_counter_1_i = Math.round(
                (i_counter_1_i + i_incrimenter_0_i) * i_precision_1_i
            ) / i_precision_1_i;

            }

            ) / i_precision_1_i;
        
            if (i_counter_4_i > i_limit_0_i) {
                i_counter_4_i = 0;
            }
        }
        
        
        i_update_counter_4_i();
